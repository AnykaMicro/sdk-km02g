# system config file
# comment lines start with # or ;

# Global setting [Common]
[Common]
dmesg=0                     ; 0:disable 1:enable
middle_log=0                ; 0:default 1-2:warn 3:notice 4+:error
rtt_log=0                   ; 0:disable 1:enable
app_log=0                   ; 0:error 1:warn 2:info 3:debug
app_log_save=0              ; 0:nothing 1:save file
power_off_time=0           ; poweroff_time for debug

# Wi-Fi AP started by the image-debug and UVC photo modes.
# password: WPA2 passphrase, 8-63 characters. There is no default: while it is
# empty, those modes do not start the AP.
# No comments after a value on these lines: everything after '=' is the value.
[DebugAp]
ssid=AI_GLASS_DEBUG
password=
