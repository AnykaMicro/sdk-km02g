# Placeholder. ai_glass_demo writes ssid= and wpa_passphrase= (8-63 characters)
# before it starts the AP; with an empty passphrase hostapd refuses to start.
interface=wlan0
ctrl_interface=/tmp/hostapd
ignore_broadcast_ssid=0
wmm_enabled=1
ht_capab=[SHORT-GI-20]
macaddr_acl=0
auth_algs=1
wpa_pairwise=TKIP CCMP
rsn_pairwise=CCMP
ssid=YOUR_AP_SSID
wpa_passphrase=
channel=11
hw_mode=g
ieee80211n=1
wpa=2
wpa_key_mgmt=WPA-PSK
