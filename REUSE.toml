# Licence information for files that cannot carry an SPDX header
# (https://reuse.software/spec-3.2/). Source files carry their own headers.
version = 1

# Runtime configuration. passwd, shadow and the rate-power tables have no
# comment syntax, and the INI files are parsed by code that keeps inline text.
[[annotations]]
path = ["rootfs/config/**", "apps/ai_glass_demo/common/config/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2018-2026 Guangzhou Anyka Microelectronics Co., Ltd."
SPDX-License-Identifier = "Apache-2.0"

# Ramdisk files from V1.00: init and OTA scripts, /etc files and etc/format_tool
# (an Anyka binary kept unchanged; its origin is still to be confirmed)
[[annotations]]
path = ["rootfs/skeleton/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2018-2026 Guangzhou Anyka Microelectronics Co., Ltd."
SPDX-License-Identifier = "Apache-2.0"

# BusyBox build configuration, generated by BusyBox's own Kconfig
[[annotations]]
path = ["rootfs/busybox-1.35.0.config"]
precedence = "aggregate"
SPDX-FileCopyrightText = "BusyBox authors; 2026 Guangzhou Anyka Microelectronics Co., Ltd."
SPDX-License-Identifier = "GPL-2.0-only"
